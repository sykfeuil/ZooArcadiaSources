<div class="text-primary text-center p-3">
    <h2 class="fs-1 fw-bold">Donnez-nous votre avis</h2>
</div>

<div class="container-fluid p-3 m-0 text-dark">
    <form>
        <div class="mb-3">
          <label for="inputName" class="form-label">Nom complet</label>
          <input type="text" class="form-control" id="inputName">
          <div id="nameHelp" class="form-text">Le nom sous lequel apparaîtra votre avis une fois validé</div>
        </div>

        <div class="mb-3">
          <label for="inputRating" class="form-label">Votre avis</label>
          <textarea class="form-control" id="inputRating" rows="5"></textarea>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary px-5">Envoyer</button>
        </div>
      </form>
</div>
