<div class="text-primary text-center p-3">
    <h2 class="fs-1 fw-bold">Contactez-nous</h2>
</div>

<div class="container-fluid p-3 m-0 text-dark">
    <form class="py-5">
        <div class="mb-3">
            <label for="inputEmail" class="form-label">Adresse mail</label>
            <input type="email" class="form-control" id="inputEmail" placeholder="johndoe@email.fr">
          </div>

        <div class="mb-3">
          <label for="inputTitle" class="form-label">Sujet</label>
          <input type="text" class="form-control" id="inputTitle">
        </div>

        <div class="mb-3">
          <label for="inputDescription" class="form-label">Description</label>
          <textarea class="form-control" id="inputDescription" rows="5"></textarea>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary px-5">Envoyer</button>
        </div>
      </form>
</div>
